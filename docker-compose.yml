services:
  postgres:
    image: postgres:15-alpine
    container_name: globaledge_postgres
    environment:
      POSTGRES_DB: globaledge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d globaledge']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globaledge_backend
    ports:
      - '5000:5000'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: globaledge
      DB_USER: postgres
      DB_PASSWORD: password
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: globaledge_frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
